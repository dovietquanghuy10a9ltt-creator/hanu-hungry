<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8232d"/>
      <stop offset="100%" stop-color="#6e1319"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" rx="16" fill="url(#bg3)"/>
  
  <!-- Cosmic stars -->
  <text x="70" y="70" font-size="28" fill="#fdebd0" opacity="0.8">✦</text>
  <text x="250" y="60" font-size="22" fill="#fdebd0" opacity="0.7">✧</text>
  <text x="240" y="170" font-size="26" fill="#eaa979" opacity="0.8">✳</text>
  <text x="75" y="175" font-size="18" fill="#fdebd0" opacity="0.5">✦</text>

  <!-- Ticket shape center -->
  <g transform="translate(100, 50)">
    <rect width="120" height="120" rx="14" fill="#fffdf8" stroke="#d2bca3" stroke-width="2"/>
    <circle cx="60" cy="50" r="26" fill="#f5ebe1"/>
    <text x="60" y="58" font-size="30" text-anchor="middle" fill="#8c1d24">✦</text>
    <rect x="25" y="85" width="70" height="8" rx="4" fill="#eaa979"/>
    <rect x="35" y="98" width="50" height="6" rx="3" fill="#d2bca3" opacity="0.6"/>
  </g>

  <!-- Badge label -->
  <rect x="20" y="20" width="76" height="24" rx="12" fill="#fffdf8" opacity="0.9"/>
  <text x="58" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#8c1d24" text-anchor="middle">GACHA</text>
</svg>
